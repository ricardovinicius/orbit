name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web-quality:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml

      - name: Cache installed dependencies
        id: dependencies
        uses: actions/cache@v5
        with:
          path: apps/web/node_modules
          key: web-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('apps/web/package.json', 'apps/web/pnpm-lock.yaml', 'apps/web/pnpm-workspace.yaml', 'apps/web/.npmrc', '.npmrc') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check linting, formatting, and imports
        run: pnpm check

      - name: Check types
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Install Chromium
        if: github.event_name != 'schedule'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install all browsers
        if: github.event_name == 'schedule'
        run: pnpm exec playwright install --with-deps

      - name: Test database policies and provisioning
        run: pnpm test:database

      - name: Test authentication against Supabase
        run: pnpm test:backend

      # The Playwright webServer builds and serves the production app.
      - name: Run Chromium E2E tests
        if: github.event_name != 'schedule'
        run: pnpm test:e2e

      - name: Run all browser and mobile E2E projects
        if: github.event_name == 'schedule'
        run: pnpm test:e2e:all

      - name: Upload E2E failure reports and traces
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      # Validate the standalone production image.
      - name: Build web image
        run: docker compose build web
